name: Keep AI Studio sessions alive

on:
  schedule:
    # GitHub Actions menggunakan UTC.
    # Jalan setiap 6 jam: 00:00, 06:00, 12:00, 18:00 UTC.
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ai-studio-keepalive
  cancel-in-progress: false

jobs:
  visit:
    runs-on: ubuntu-latest

    # Maksimal 6 jam. Browser disetel 350 menit agar ada waktu cleanup.
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        # Instance 1 menggunakan URL 1, instance 2 menggunakan URL 2, dst.
        instance: [1, 2, 3, 4, 5]
      max-parallel: 5

    env:
      AI_STUDIO_URL: ${{ secrets.AI_STUDIO_URL }}
      GMAIL_USER_LIST: ${{ secrets.GMAIL_USER_LIST }}
      GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
      GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
      GMAIL_STORAGE_STATE: ${{ secrets.GMAIL_STORAGE_STATE }}

      # 350 menit = 5 jam 50 menit.
      KEEP_OPEN_MINUTES: '350'

      # Reload halaman setiap 30 menit.
      RELOAD_INTERVAL_MINUTES: '30'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Restore Playwright storage state
        if: ${{ env.GMAIL_STORAGE_STATE != '' }}
        shell: bash
        run: |
          printf '%s' "$GMAIL_STORAGE_STATE" | base64 --decode > storageState.json
          test -s storageState.json

      - name: Run browser keepalive
        env:
          INSTANCE: ${{ matrix.instance }}
        run: node scripts/login-and-click.js

      - name: Upload screenshots and debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-instance-${{ matrix.instance }}
          if-no-files-found: ignore
          path: |
            opened-${{ matrix.instance }}-*.png
            debug-${{ matrix.instance }}-*.png
            debug-${{ matrix.instance }}-*.html
            debug-${{ matrix.instance }}-cookies.json
