name: Refresh AI Studio app (every 15 minutes)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        instance: [1,2,3,4,5]

    env:
      TARGET_URL: ${{ secrets.AI_STUDIO_URL }}
      GMAIL_USER_LIST: ${{ secrets.GMAIL_USER_LIST }}
      GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
      KEEP_OPEN_MINUTES: '15'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps & Playwright browsers (npm ci -> fallback)
        run: |
          npm ci || npm install
          npx playwright install --with-deps

      - name: Decode storageState (optional)
        run: |
          if [ -n "${{ secrets.GMAIL_STORAGE_STATE }}" ]; then
            printf "%s" "${{ secrets.GMAIL_STORAGE_STATE }}" | base64 --decode > storageState.json
            ls -l storageState.json
          else
            echo "No GMAIL_STORAGE_STATE secret set."
          fi

      - name: Run login + click (matrix instance)
        run: node scripts/login-and-click.js
        env:
          INSTANCE: ${{ matrix.instance }}

      - name: Upload screenshots & debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-instance-${{ matrix.instance }}
          path: |
            opened-${{ matrix.instance }}-*.png
            debug-${{ matrix.instance }}-*.png
            debug-${{ matrix.instance }}-*.html
            debug-${{ matrix.instance }}-cookies.json
