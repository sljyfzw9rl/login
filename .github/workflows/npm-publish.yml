name: Keep AI Studio sessions alive - 25 matrix

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ai-studio-25-matrix
  cancel-in-progress: false

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        email_index: [1, 2, 3, 4, 5]
        url_index: [1, 2, 3, 4, 5]
      max-parallel: 25

    env:
      GMAIL_ACCOUNT_LIST: ${{ secrets.GMAIL_ACCOUNT_LIST }}
      AI_STUDIO_URL: ${{ secrets.AI_STUDIO_URL }}
      GMAIL_STORAGE_STATE: ${{ secrets.GMAIL_STORAGE_STATE }}

      KEEP_OPEN_MINUTES: '350'
      RELOAD_INTERVAL_MINUTES: '30'

      EMAIL_INDEX: ${{ matrix.email_index }}
      URL_INDEX: ${{ matrix.url_index }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Restore Playwright storage state
        if: ${{ env.GMAIL_STORAGE_STATE != '' }}
        shell: bash
        run: |
          printf '%s' "$GMAIL_STORAGE_STATE" | base64 --decode > storageState.json
          test -s storageState.json

      - name: Run AI Studio browser session
        run: node scripts/login-and-click.js

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-email-${{ matrix.email_index }}-url-${{ matrix.url_index }}
          if-no-files-found: ignore
          path: |
            opened-email-${{ matrix.email_index }}-url-${{ matrix.url_index }}-*.png
            debug-email-${{ matrix.email_index }}-url-${{ matrix.url_index }}-*.png
            debug-email-${{ matrix.email_index }}-url-${{ matrix.url_index }}-*.html
            debug-email-${{ matrix.email_index }}-url-${{ matrix.url_index }}-*.json
